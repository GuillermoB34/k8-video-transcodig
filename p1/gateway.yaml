
# Gatway Class Config 
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-gwc
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  
---
#Gateway configuration
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: pf
spec:
  gatewayClassName: envoy-gwc
  addresses:
    - type: IPAddress
      value: 192.168.1.50
  listeners:
  - name: http-80
    protocol: HTTP
    port: 80
  - name: http-8080
    protocol: HTTP
    port: 8080
---
#HTTP Route TRANSCODING 
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-route-transcoding
  namespace: pf
spec:
  parentRefs: # Referencia al Gateway
  - name: gateway
    sectionName: http-8080
  hostnames:
  - localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /x264-fn-events
    backendRefs: # Servicio de Transcodificación
    - name: svc-transcoding
      port: 8080

---
#HTTP ROUTE UPLOAD-NGINEX
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-route-upload
  namespace: pf
spec:
  parentRefs:
  - name: gateway
    sectionName: http-80
  hostnames:
  - localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /encodedVideos
    backendRefs: 
    - name: svc-upload-nginx
      port: 80