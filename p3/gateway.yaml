# Emvoy Proxy Gateway
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-proxy
  namespace: encoding
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: http-80
                  nodePort: 30080
                  port: 80

---
# Gatway Class Config
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-gwc
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: envoy-proxy
    namespace: encoding

---
#Gateway configuration
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: encoding
spec:
  gatewayClassName: envoy-gwc
  listeners:
    - name: http-80
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
---
#HTTP Route TRANSCODING
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-route-transcoding
  namespace: encoding
spec:
  parentRefs: # Referencia al Gateway
    - name: gateway
      sectionName: http-80
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /x264-fn-events
      backendRefs: # Servicio de Transcodificación
        - name: svc-transcoding
          port: 80

---
#HTTP ROUTE UPLOAD-NGINX
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-route-upload
  namespace: encoding
spec:
  parentRefs:
    - name: gateway
      sectionName: http-80
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /encodedVideos
      backendRefs:
        - name: svc-upload-nginx
          port: 80

---
#HTTP Route access metrics
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-metrics-transcoding
  namespace: metrics
spec:
  hostnames:
    - metrics.tarea.cn.uv.es
  parentRefs:
    - name: gateway
      namespace: encoding
      sectionName: http-80
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /stats
      backendRefs:
        - name: metrics-service
          namespace: metrics
          port: 8080
